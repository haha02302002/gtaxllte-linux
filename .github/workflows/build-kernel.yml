name: Build Linux kernel for SM-T585 (gtaxllte)

# gh release create/upload needs a write token; the default for new repos is read-only.
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      enable_vt:
        description: 'Enable virtual terminal / framebuffer console'
        type: boolean
        default: true
      embed_distro:
        description: 'Embed the Alpine minirootfs into the initramfs (RAM boot)'
        type: boolean
        default: false

env:
  KERNEL_REPO: https://github.com/followmsi/android_kernel_samsung_exynos7870.git
  KERNEL_BRANCH: '12'          # Linux 3.18.140
  DEFCONFIG: lineage-gtaxllte_defconfig
  TC_URL: https://developer.arm.com/-/media/Files/downloads/gnu-a/8.3-2019.03/binrel/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
  TC_DIR: /opt/aarch64-tc

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev python3 zip unzip \
            ccache xz-utils cpio rsync e2fsprogs

      - name: Fetch aarch64 cross toolchain (GCC 8.3)
        run: |
          mkdir -p "${TC_DIR}"
          if [ ! -x "${TC_DIR}/bin/aarch64-linux-gnu-gcc" ]; then
            curl -fL --retry 3 -o /tmp/tc.tar.xz "${TC_URL}"
            tar -xJf /tmp/tc.tar.xz -C "${TC_DIR}" --strip-components=1
          fi
          "${TC_DIR}/bin/aarch64-linux-gnu-gcc" --version | head -1

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
          cd kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr '\n' ' '
          echo
          test -f "arch/arm64/configs/${DEFCONFIG}" || { echo "missing ${DEFCONFIG}"; exit 1; }

      # The HX8279D panel is dead for the rest of the boot once decon_blank()
      # maps FB_BLANK_NORMAL to decon_disable(): X sets KD_GRAPHICS on its VT,
      # the rails are cut and nothing re-sends hx8279d_init(). See the patch
      # header for the measurements.
      - name: Apply panel patch
        run: |
          set -euo pipefail
          P="${GITHUB_WORKSPACE}/patches/0001-panel-survive-fb_blank.patch"
          test -f "$P" || { echo "missing $P"; exit 1; }
          cd kernel
          # patch(1) rather than git apply: the patch is authored and committed
          # from a Windows checkout, and CRLF makes git apply reject it while
          # patch tolerates both endings.
          patch -p1 --dry-run --forward --batch <"$P"
          patch -p1 --forward --batch <"$P"
          # Fail the build if either hunk silently did not land.
          grep -q 'blank_mode == FB_BLANK_NORMAL' \
            drivers/video/fbdev/exynos/decon_7870/decon_core.c
          grep -q 'Always suspend the panel' \
            drivers/video/fbdev/exynos/decon_7870/dsim_drv.c
          echo "panel patch applied to decon_7870"

      - name: Build kernel Image
        run: |
          ./scripts/build.sh
        env:
          CROSS_COMPILE: /opt/aarch64-tc/bin/aarch64-linux-gnu-
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT: ${{ github.workspace }}/out
          ENABLE_VT: ${{ inputs.enable_vt && '1' || '1' }}
          EMBED_DISTRO: ${{ inputs.embed_distro && '1' || '0' }}

      # alpine-minirootfs is a chroot image: no openrc, no /etc/init.d, root locked
      # and an inittab that runs /sbin/openrc. It is fixed up here and given the
      # whole desktop stack, because the tablet has no usable network (qcacld wants
      # firmware that is not shipped) and can therefore never run apk itself.
      - name: Build Alpine rootfs image with XFCE
        run: |
          set -euo pipefail
          MIRROR=https://dl-cdn.alpinelinux.org/alpine
          BRANCH=v3.20
          FILE=$(curl -fsSL "$MIRROR/$BRANCH/releases/aarch64/" | grep -oE 'alpine-minirootfs-[0-9.]+-aarch64\.tar\.gz' | sort -uV | tail -1)
          echo "alpine: $FILE"
          curl -fsSL -o /tmp/alpine.tar.gz "$MIRROR/$BRANCH/releases/aarch64/$FILE"
          rm -rf /tmp/rootfs && mkdir -p /tmp/rootfs
          sudo tar -xzf /tmp/alpine.tar.gz -C /tmp/rootfs

          # apk is architecture-agnostic for extraction (-X mirrors, --arch aarch64)
          # and --no-scripts skips the aarch64 binaries this x86 container cannot run.
          # Services come from our own inittab, not openrc, so the skipped scripts
          # are not needed.
          #
          # font-misc-misc/adwaita-icon-theme are not optional: XFCE's
          # panel, xfdesktop and libwnck abort at startup when no icon theme and
          # no PNG decoding are available, which shows up as a black screen with
          # only a root window. They pull the pieces XFCE expects on a normal
          # Alpine desktop install.
          docker run --rm -v /tmp/rootfs:/rootfs alpine:3.20 sh -c '
            set -e
            apk --root /rootfs --arch aarch64 --no-scripts --no-progress add \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.20/main \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.20/community \
                xorg-server xf86-video-fbdev xf86-input-evdev xf86-input-libinput \
                libinput eudev \
                twm xterm font-misc-misc font-dejavu font-noto \
                xfce4 xfce4-terminal xfce4-screenshooter xfce4-panel \
                adwaita-icon-theme hicolor-icon-theme shared-mime-info \
                matchbox-keyboard dbus polkit \
                mesa mesa-dri-gallium mesa-utils \
                alsa-utils alsa-ucm-conf \
                wpa_supplicant iw wireless-tools bluez bluez-deprecated
            ls /rootfs/usr/bin/startxfce4 /rootfs/usr/bin/Xorg /rootfs/usr/bin/twm
            ls /rootfs/usr/lib/xorg/modules/drivers/fbdev_drv.so
            ls /rootfs/usr/lib/xorg/modules/input/libinput_drv.so /rootfs/sbin/udevd
            ls -d /rootfs/usr/share/icons/Adwaita
            for f in /rootfs/usr/bin/glxinfo /rootfs/usr/bin/aplay \
                     /rootfs/usr/sbin/wpa_supplicant \
                     /rootfs/usr/lib/bluetooth/bluetoothd; do
                [ -e "$f" ] && echo "ok $f" || echo "MISSING $f"
            done
          '

          # image fixups: unlocked root, busybox inittab, hostname, resolv, fstab
          sudo sed -i 's|^root:[^:]*:|root::|' /tmp/rootfs/etc/shadow
          printf '::sysinit:/bin/mount -a\n::sysinit:/bin/hostname -F /etc/hostname\nttyGS0::respawn:/sbin/getty -n -l /bin/sh -L ttyGS0 115200 vt100\ntty1::respawn:/bin/sh /usr/local/bin/start-gui\n::sysinit:/usr/local/bin/driver-check\n::respawn:/usr/local/bin/usb-console-watchdog\n::ctrlaltdel:/sbin/reboot\n::shutdown:/bin/umount -a -r\n' | sudo tee /tmp/rootfs/etc/inittab >/dev/null
          echo gtaxllte | sudo tee /tmp/rootfs/etc/hostname >/dev/null
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /tmp/rootfs/etc/resolv.conf >/dev/null
          printf 'proc /proc proc defaults 0 0\nsysfs /sys sysfs defaults 0 0\ndevpts /dev/pts devpts defaults 0 0\ntmpfs /run tmpfs defaults 0 0\ntmpfs /tmp tmpfs defaults 0 0\n' | sudo tee /tmp/rootfs/etc/fstab >/dev/null
          sudo mkdir -p /tmp/rootfs/run /tmp/rootfs/tmp /tmp/rootfs/dev/pts /tmp/rootfs/etc/X11
          sudo mkdir -p /tmp/rootfs/lib/firmware
          # Vendor firmware the built-in drivers request at probe time. Without it
          # cnss reports a firmware load failure and no wlan0 ever appears, and
          # s5p-mfc cannot bring up the video codec (mfc_fw.bin). Paths cover both
          # the CNSS convention (/etc/firmware) and the generic one (/lib/firmware).
          sudo mkdir -p /tmp/rootfs/lib/firmware/wlan/qca_cld /tmp/rootfs/lib/firmware/wlan/prima /tmp/rootfs/etc/firmware/wlan
          sudo cp -a firmware/. /tmp/rootfs/lib/firmware/
          sudo cp -a firmware/. /tmp/rootfs/etc/firmware/
          sudo cp -f firmware/wlan/qcom_cfg.ini /tmp/rootfs/lib/firmware/wlan/qca_cld/WCNSS_qcom_cfg.ini
          sudo cp -f firmware/wlan/qcom_cfg.ini /tmp/rootfs/lib/firmware/wlan/prima/WCNSS_qcom_cfg.ini
          sudo cp -f firmware/wlan/WCNSS_cfg.dat /tmp/rootfs/lib/firmware/wlan/qca_cld/WCNSS_cfg.dat
          for f in /tmp/rootfs/lib/firmware/bdwlan30.bin /tmp/rootfs/lib/firmware/qwlan30.bin /tmp/rootfs/lib/firmware/otp30.bin /tmp/rootfs/lib/firmware/utf30.bin /tmp/rootfs/lib/firmware/mfc_fw.bin /tmp/rootfs/lib/firmware/wlan/qca_cld/WCNSS_qcom_cfg.ini; do
              [ -s "$f" ] && echo "ok $f" || echo "MISSING $f"
          done

          # Start X on the framebuffer with the touchscreen as the pointer. The event
          # node number moves between boots, so it is resolved by device name.
          sudo install -m 755 scripts/start-gui.sh /tmp/rootfs/usr/local/bin/start-gui
          # This repo is checked out on Windows with core.autocrlf, so a script can
          # land here with CRLF endings: the kernel then sees a shebang of
          # "#!/bin/sh
", which is not a valid interpreter and the script fails to
          # exec with "exec format error". Normalise every installed script.
          sudo sed -i 's/
$//' /tmp/rootfs/usr/local/bin/start-gui \
              /tmp/rootfs/usr/local/bin/driver-check \
              /tmp/rootfs/usr/local/bin/usb-console-watchdog
          sudo chmod 755 /tmp/rootfs/usr/local/bin/start-gui \
          sudo install -m 755 scripts/tablet-ui.sh /tmp/rootfs/usr/local/bin/tablet-ui
          sudo mkdir -p /tmp/rootfs/etc/xdg/autostart
          printf '[Desktop Entry]
Type=Application
Name=Tablet tuning
Exec=/usr/local/bin/tablet-ui
OnlyShowIn=XFCE;
X-GNOME-Autostart-enabled=true
NoDisplay=true
' | sudo tee /tmp/rootfs/etc/xdg/autostart/tablet-ui.desktop >/dev/null
              /tmp/rootfs/usr/local/bin/driver-check \
              /tmp/rootfs/usr/local/bin/usb-console-watchdog
          sudo install -m 755 scripts/usb-console-watchdog.sh /tmp/rootfs/usr/local/bin/usb-console-watchdog
          sudo install -m 755 scripts/driver-check.sh /tmp/rootfs/usr/local/bin/driver-check

          # autologin into XFCE when X is started from tty1 as root
          sudo tee /tmp/rootfs/root/.xinitrc >/dev/null <<'XINIT'
          #!/bin/sh
          exec startxfce4
          XINIT
          sudo chmod 755 /tmp/rootfs/root/.xinitrc

      # apk --no-scripts cannot run post-install triggers, and one of them is the
      # whole reason XFCE was dying: gdk-pixbuf's trigger is what builds
      # /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache, and with no cache gdk-pixbuf
      # registers no image loaders at all. GTK then fails to decode every PNG,
      # libwnck/GTK abort on the missing icons and the panel never draws, which
      # is exactly the black screen after the kernel log.
      #
      # The cache is architecture independent (same package version, same absolute
      # module paths), so it is produced by a normal install of the same Alpine
      # release in an x86 container and copied into the aarch64 rootfs. The same
      # applies to the X core font index, another skipped trigger.
      - name: Assemble desktop indexes (pixbuf loaders, X fonts)
        run: |
          set -euo pipefail

          for b in /usr/bin/startxfce4 /usr/bin/xfwm4 /usr/bin/xfdesktop \
                   /usr/bin/xfce4-panel /usr/bin/twm /usr/bin/xterm /usr/bin/Xorg; do
            sudo test -x "/tmp/rootfs$b" || { echo "MISSING $b"; exit 1; }
            echo "ok $b"
          done

          ICONS=$(sudo find /tmp/rootfs/usr/share/icons -maxdepth 1 -iname 'adwaita*' | head -1)
          echo "icon theme: ${ICONS#/tmp/rootfs}"
          sudo test -n "$ICONS" && sudo test -d "$ICONS"

          docker run --rm alpine:3.20 sh -c '
            apk add --no-progress gdk-pixbuf >/dev/null
            gdk-pixbuf-query-loaders --update-cache
            cat /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
          ' > /tmp/loaders.cache
          echo "pixbuf loaders in cache: $(grep -c '^"' /tmp/loaders.cache)"
          grep -q 'libpixbufloader-png' /tmp/loaders.cache || echo "note: no png module (builtin in 2.42)"
          sudo install -D -m 644 /tmp/loaders.cache \
            /tmp/rootfs/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache

          # The loaders cache alone is not enough: gdk-pixbuf selects a loader by
          # MIME type, so it also needs the shared MIME database. shared-mime-info's
          # post-install trigger is skipped by --no-scripts, and with no
          # /usr/share/mime/mime.cache even a real PNG fails with "Unrecognized
          # image file format", which aborts the panel (Wnck default_icon_at_size)
          # and leaves the black screen. Built the same way, from the same Alpine
          # release, into the aarch64 rootfs.
          docker run --rm -v /tmp/rootfs:/rootfs alpine:3.20 sh -c '
            apk add --no-progress shared-mime-info >/dev/null
            update-mime-database /rootfs/usr/share/mime
          '
          sudo test -s /tmp/rootfs/usr/share/mime/mime.cache
          echo "mime db: $(sudo stat -c%s /tmp/rootfs/usr/share/mime/mime.cache) bytes"

          docker run --rm alpine:3.20 sh -c '
            apk add --no-progress font-misc-misc >/dev/null
            cat /usr/share/fonts/misc/fonts.dir
          ' > /tmp/fonts.dir
          sudo install -D -m 644 /tmp/fonts.dir /tmp/rootfs/usr/share/fonts/misc/fonts.dir
          echo "x core fonts indexed: $(($(wc -l < /tmp/fonts.dir) - 1))"

      - name: Build ext4 rootfs image
        run: |
          set -euo pipefail
          rm -f out/rootfs.img out/rootfs.img.gz
          # No metadata_csum: this 3.18 kernel cannot validate ext4 metadata
          # checksums, so the first write from the running system leaves a bad
          # superblock checksum and the loader can no longer mount the image
          # ("invalid superblock checksum. Run e2fsck?").
          # This image is mounted by Linux 3.18. metadata_csum is fatal there: the
          # first read-write mount rewrites the superblock with a checksum this
          # kernel will not accept again, so the NEXT boot refuses the mount
          # ("invalid superblock checksum") and drops to the loader shell. The
          # feature set is therefore pinned explicitly and verified below.
          sudo mke2fs -q -t ext4 -F -L alpine -b 4096 -I 256 \
            -O ^metadata_csum,^metadata_csum_seed,^64bit,^bigalloc,^quota,^project,^ea_inode,^casefold,^encrypt,^verity,^fast_commit,^inline_data,^sparse_super2 \
            -E lazy_itable_init=0,lazy_journal_init=0 \
            -d /tmp/rootfs out/rootfs.img 2048M
          echo "image bytes: $(stat -c%s out/rootfs.img)"
          python3 tools/check_rootfs_sb.py out/rootfs.img
          sudo e2fsck -fn out/rootfs.img || true
          gzip -9 out/rootfs.img
          echo "gz bytes: $(stat -c%s out/rootfs.img.gz)"
          echo "gz md5: $(md5sum out/rootfs.img.gz | cut -d' ' -f1)"

      - name: Report result
        run: |
          echo "### boot.img built" >> "$GITHUB_STEP_SUMMARY"
          ls -l out/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          md5sum out/boot.img >> "$GITHUB_STEP_SUMMARY"
          [ -f out/rootfs.img.gz ] && md5sum out/rootfs.img.gz >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: gtaxllte-linux-boot
          path: |
            out/boot.img
            out/Image
            out/ramdisk.gz
            out/config.effective
            out/build-info.txt
          if-no-files-found: error

      - name: Upload Alpine rootfs image
        uses: actions/upload-artifact@v4
        with:
          name: alpine-rootfs
          path: out/rootfs.img.gz
          if-no-files-found: error

      # One file the tablet can flash from TWRP: kernel plus rootfs, streamed by
      # a shell installer, so a single flash brings a dead tablet back.
      - name: Build TWRP flashable zip
        run: |
          set -euo pipefail
          python3 tools/make_twrp_zip.py \
            --boot out/boot.img \
            --rootfs out/rootfs.img.gz \
            --out out/gtaxllte-linux-twrp.zip

      - name: Upload TWRP flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: gtaxllte-linux-twrp
          path: out/gtaxllte-linux-twrp.zip
          if-no-files-found: error

      # Artifact downloads need an authenticated session even on a public repo;
      # a release asset is a plain public URL, so the build can be fetched with
      # curl from the machine that flashes the tablet.
      - name: Publish boot.img as a public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=kernel-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title 'Latest gtaxllte Linux kernel' \
            --notes 'Rolling release: boot.img from the newest successful Actions run.'
          gh release upload "$TAG" out/boot.img out/build-info.txt --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/boot.img"
