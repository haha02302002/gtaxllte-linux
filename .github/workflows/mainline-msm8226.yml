name: mainline-msm8226

# Builds the mainline kernel + device tree for the Samsung SM-T365 (rubenslte).
# The Windows host has no toolchain, so this is the build path.
#
# Artifacts are attached to the "mainline-msm8226" release as well, so the
# kernel can be downloaded without a GitHub token.

on:
  workflow_dispatch:
  push:
    paths:
      - 'mainline/**'
      - '.github/workflows/mainline-msm8226.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # apt on the hosted runners fails intermittently (exit code 100, mirror
      # metadata), and a failed install kills the build before a single object
      # file is compiled - that has now cost two runs. Retry longer, and keep
      # the output in ci-apt.log so the reason is readable from the release
      # (Actions logs need a token, release assets do not).
      - name: Install cross toolchain
        run: |
          set -o pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo ">>> apt attempt $attempt" | tee -a ci-apt.log
            if sudo apt-get update -o Acquire::Retries=5 2>&1 | tee -a ci-apt.log && \
               sudo apt-get install -y --no-install-recommends \
                 gcc-arm-linux-gnueabihf bc bison flex libssl-dev libelf-dev \
                 device-tree-compiler python3 rsync 2>&1 | tee -a ci-apt.log; then
              ok=1
              break
            fi
            sleep 45
          done
          echo "=== result: ok=$ok ===" | tee -a ci-apt.log
          arm-linux-gnueabihf-gcc --version 2>&1 | head -1 | tee -a ci-apt.log
          dtc --version 2>&1 | tee -a ci-apt.log
          echo "  (dtb check is advisory only)"

      - name: Build kernel and dtb
        run: |
          chmod +x mainline/build-kernel.sh
          JOBS="$(nproc)" bash mainline/build-kernel.sh 2>&1 | tee -a ci-apt.log

      - name: Check the dtb compiled and describes the tablet
        continue-on-error: true
        run: |
          # Verify by reading the dtb's own string block: no dtc, no root, and
          # every expectation is reported instead of dying on the first miss.
          ls -l work/out-mainline/rubenslte.dtb
          ok=1
          for want in 'Samsung Galaxy Tab Active' 'simple-framebuffer' 'syna,rmi4-i2c' 'qcom,msm-id'; do
            if grep -aq "$want" work/out-mainline/rubenslte.dtb; then
              echo "  dtb has     : $want"
            else
              echo "  DTB MISSING : $want"
              ok=0
            fi
          done
          echo "zImage: $(stat -c %s work/out-mainline/zImage) bytes"
          echo "  (dtb check is advisory only)"

      - uses: actions/upload-artifact@v4
        with:
          name: rubenslte-mainline
          path: |
            work/out-mainline/zImage
            work/out-mainline/zImage-dtb
            work/out-mainline/rubenslte.dtb
            work/out-mainline/boot.img
            work/out-mainline/boot-qcdt.img
            work/out-mainline/greenpaint.img
            work/linux-msm8226/.config
            ci-apt.log
          if-no-files-found: warn

      # Publish the log even when the build failed: this is the only way to see
      # what apt/kernel did, since the release is public and Actions logs are not.
      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mainline-msm8226
          name: mainline msm8226 (SM-T365 rubenslte)
          body: |
            Mainline kernel and device tree for the Samsung Galaxy Tab Active 8.0
            (SM-T360 / SM-T365, codename rubenslte, Qualcomm APQ8026 / msm8226).

            Files: zImage, rubenslte.dtb, zImage-dtb, boot.img, boot-qcdt.img.
            boot-qcdt.img is for stock Samsung aboot (QCDT + SEANDROIDENFORCE).
            Console comes out on the USB gadget (ttyGS0), not the panel.
            ci-apt.log holds the toolchain/build output of the last run.
          files: |
            work/out-mainline/zImage
            work/out-mainline/zImage-dtb
            work/out-mainline/rubenslte.dtb
            work/out-mainline/boot.img
            work/out-mainline/boot-qcdt.img
            work/out-mainline/greenpaint.img
            work/linux-msm8226/.config
            ci-apt.log
          fail_on_unmatched_files: false
